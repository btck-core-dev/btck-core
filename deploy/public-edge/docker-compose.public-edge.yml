services:
  btck-public-edge:
    image: nginx:1.30.5-alpine3.24
    container_name: btck-public-edge
    profiles: ["public-edge"]
    restart: unless-stopped
    environment:
      BTCK_PUBLIC_HOST: "${BTCK_PUBLIC_HOST:?BTCK_PUBLIC_HOST is required}"
      BTCK_POOL_PUBLIC_HOST: "${BTCK_POOL_PUBLIC_HOST:?BTCK_POOL_PUBLIC_HOST is required}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/public-edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - "${BTCK_TLS_FULLCHAIN:?BTCK_TLS_FULLCHAIN is required}:/etc/nginx/certs/fullchain.pem:ro"
      - "${BTCK_TLS_PRIVKEY:?BTCK_TLS_PRIVKEY is required}:/etc/nginx/certs/privkey.pem:ro"
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=4m,mode=1777
    depends_on:
      - btck-explorer
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "10"
        compress: "true"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--no-check-certificate", "--header", "Host: ${BTCK_PUBLIC_HOST}", "https://127.0.0.1/edge-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
