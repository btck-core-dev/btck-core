name: Bug Report
description: Create a report to help us improve Bitcoin K
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please do not report security-sensitive vulnerabilities here; send them to `security@bitcoin-k.com`.
  - type: input
    id: version
    attributes:
      label: Node / Component Version
      description: What version of btck-core, btckd, stratum, or wallet are you running?
      placeholder: "e.g., v1.0.0 (commit 3a2418d)"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating System / Hardware
      options:
        - Ubuntu / Debian Linux
        - RHEL / CentOS
        - macOS
        - Windows
        - ASIC Miner (IceRiver KS0/KS1/KS2/KS3/KS5)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start daemon with `...`
        2. Execute RPC call `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste relevant sanitized log lines (never paste private keys or sensitive credentials).
      render: shell
