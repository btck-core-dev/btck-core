services:
  btck-node:
    build: .
    container_name: btck-full-node
    restart: unless-stopped
    command: ["python3", "/app/src/node/daemon.py", "--host", "0.0.0.0", "--p2p-host", "0.0.0.0", "--p2p-port", "16112", "--network", "${BTCK_NETWORK:-devnet}", "--data-root", "/app/data"]
    environment:
      BTCK_NETWORK: "${BTCK_NETWORK:-devnet}"
      BTCK_RPC_TOKEN: "${BTCK_RPC_TOKEN:?BTCK_RPC_TOKEN is required}"
    ports:
      - "127.0.0.1:16110:16110"  # authenticated RPC, host-loopback only
      - "16112:16112"  # P2P Gossip
    volumes:
      - btck-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  btck-stratum:
    build: .
    container_name: btck-stratum-pool
    restart: unless-stopped
    environment:
      BTCK_NETWORK: "${BTCK_NETWORK:-devnet}"
      BTCK_RPC_TOKEN: "${BTCK_RPC_TOKEN:?BTCK_RPC_TOKEN is required}"
      BTCK_STRATUM_HOST: "0.0.0.0"
      BTCK_NODE_RPC_URL: "http://btck-node:16110/rpc"
    command: ["python3", "/app/src/stratum/stratum_server.py"]
    ports:
      - "3333:3333"    # Stratum V1 ASIC Port
    depends_on:
      - btck-node
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  btck-ai-gateway:
    build: .
    container_name: btck-ai-rpc-gateway
    restart: unless-stopped
    profiles: ["unsafe-prototypes"]
    environment:
      BTCK_NETWORK: "${BTCK_NETWORK:-devnet}"
    command: ["python3", "-c", "import sys; sys.path.insert(0, '/app/src'); from config.network import require_feature; require_feature('ai_payments'); from gateway.ai_rpc_gateway import AIRPCGateway; print('AI-RPC Gateway Active')"]
    ports:
      - "8080:8080"    # HTTP 402 AI-RPC Gateway
    depends_on:
      - btck-node

volumes:
  btck-data:
